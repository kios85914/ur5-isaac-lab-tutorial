# =============================================================
# PPO 設定檔 (skrl) -- UR5 Reach 任務
#
# 觀測空間 : 15 維 (joint_pos 6 + joint_vel 6 + target_pos 3)
# 動作空間 : 6 維 (關節位置增量)
# =============================================================

seed: 42

# ---- 模型架構 ----
models:
  separate: False   # policy 和 value 共用前面的網路層

  policy:
    class: GaussianMixin    # 連續動作用高斯分布
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0

    network:
      - name: net
        input: OBSERVATIONS         # 直接用 15 維觀測
        layers: [256, 128, 64]      # 3 層 MLP
        activations: [elu, elu, elu]

    output: ACTIONS                  # 輸出 6 維動作

  value:
    class: DeterministicMixin       # 值函數輸出一個數值
    clip_actions: False

    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: [elu, elu, elu]

    output: ONE                      # 輸出 1 個值

# ---- 記憶體 ----
memory:
  class: RandomMemory
  memory_size: -1   # 自動根據 rollouts 決定

# ---- PPO Agent ----
agent:
  class: PPO
  rollouts: 24              # 每個環境收集 24 步後更新
  learning_epochs: 8        # 每次更新做 8 個 epoch
  mini_batches: 4           # 分 4 個 mini-batch

  discount_factor: 0.99     # 折扣因子 γ
  gae_lambda: 0.95          # GAE λ
  learning_rate: 3.0e-04    # 學習率
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008

  # Observation and value preprocessing / 觀測和值の標準化
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0       # 梯度裁剪
  ratio_clip: 0.2           # PPO clip 範圍
  value_clip: 0.2           # Value clip (>0 enables clipping) / 値クリップ（>0で有効）
  entropy_loss_scale: 0.005  # 鼓勵探索
  value_loss_scale: 1.0
  kl_threshold: 0.008
  time_limit_bootstrap: False

  experiment:
    directory: "ur5_reach"
    experiment_name: "ppo_reach"
    write_interval: 100       # 每 100 步記錄一次
    checkpoint_interval: 5000 # 每 5000 步存一次模型
    wandb: False              # 預設不用 wandb
    wandb_kwargs:
      project: "UR5_Teaching"

# ---- 訓練器 ----
trainer:
  class: SequentialTrainer
  timesteps: 150000           # 總訓練步數
  environment_info: log
